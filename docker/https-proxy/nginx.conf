events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name zyswx.juconyun.com;
        root /usr/share/nginx/html;

        location = /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location ~ ^/[A-Za-z0-9_-]+\.txt$ {
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name zyswx.juconyun.com;
        root /usr/share/nginx/html;

        ssl_certificate /etc/nginx/certs/zyswx.juconyun.com.pem;
        ssl_certificate_key /etc/nginx/certs/zyswx.juconyun.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location = /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location ~ ^/[A-Za-z0-9_-]+\.txt$ {
            try_files $uri =404;
        }

        location /api/ {
            set $gateway_upstream gateway:8080;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }

        location / {
            return 200 "zyswx https proxy ok";
            add_header Content-Type text/plain;
        }
    }
}
