# EMQX 5.x 配置 - 直饮水平台
# 文档：https://docs.emqx.com/zh/emqx/latest/

# ---------- 节点配置（EMQX 5.x 必需） ----------
node {
  name = "emqx@127.0.0.1"
  cookie = "drinking_water_platform_secret_cookie_2026"
  data_dir = "/opt/emqx/data"
}

# ---------- MQTT 协议 ----------
mqtt {
  max_packet_size = 256KB
  max_clientid_len = 128
  max_topic_levels = 10
}

# ---------- 授权（开发阶段允许匿名接入） ----------
authorization {
  no_match = allow
}

# ---------- 监听器 ----------
listeners {
  tcp {
    default {
      bind = "0.0.0.0:1883"
      max_connections = 100000
    }
  }
  ws {
    default {
      bind = "0.0.0.0:8083"
      websocket {
        mqtt_path = "/mqtt"
      }
    }
  }
}

# ---------- Dashboard ----------
dashboard {
  listeners {
    http {
      bind = "0.0.0.0:18083"
    }
  }
  default_username = "admin"
  default_password = "EMQX@2026"
}

# ---------- 日志 ----------
log {
  console {
    level = info
  }
  file {
    level = info
    path = "/var/log/emqx/emqx.log"
    rotation_count = 5
    rotation_size = 10MB
  }
}

