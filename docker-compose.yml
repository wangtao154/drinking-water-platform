# ==============================================================================
# 直饮水平台 - Docker Compose 基础设施编排
# 包含：MySQL / Redis / InfluxDB / RabbitMQ / EMQX / MinIO / Nacos / Sentinel
# 使用方式：docker compose up -d
# ==============================================================================

name: drinking-water

services:
  # ============================================================
  # MySQL 8.0 - 业务数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: dw-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drinking-water-net

  # ============================================================
  # Redis 7 - 缓存 & 分布式锁
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: dw-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drinking-water-net

  # ============================================================
  # InfluxDB 2.7 - IoT 时序数据
  # ============================================================
  influxdb:
    image: influxdb:2.7
    container_name: dw-influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./docker/influxdb/config.yml:/etc/influxdb/config.yml:ro
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drinking-water-net

  # ============================================================
  # RabbitMQ 3.12 - 消息队列
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: dw-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5672:5672"    # AMQP
      - "127.0.0.1:15672:15672"  # 管理界面
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drinking-water-net

  # ============================================================
  # EMQX 5.3 - MQTT Broker
  # ============================================================
  emqx:
    image: emqx/emqx:5.3
    container_name: dw-emqx
    restart: always
    environment:
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_NODE__COOKIE: "drinking_water_platform_secret_cookie_2026"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      EMQX_RPC__PORT_DISCOVERY: manual
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:1883:1883"    # MQTT TCP
      - "127.0.0.1:8083:8083"    # MQTT WebSocket
      - "127.0.0.1:18083:18083"  # Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - ./docker/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drinking-water-net

  # ============================================================
  # MinIO - 对象存储（设备二维码、工单照片、滤芯照片等）
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: dw-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Console
    volumes:
      - minio_data:/data
      # RHEL base image lacks tzdata; mount zoneinfo file for TZ=Asia/Shanghai to work
      - ./docker/zoneinfo/Asia/Shanghai:/usr/share/zoneinfo/Asia/Shanghai:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drinking-water-net

  # MinIO 初始化：自动创建 bucket
  minio-init:
    image: minio/mc:latest
    container_name: dw-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb local/${MINIO_BUCKET} --ignore-existing;
        mc anonymous set download local/${MINIO_BUCKET};
        echo 'MinIO bucket [${MINIO_BUCKET}] created successfully';
      "
    networks:
      - drinking-water-net

  # ============================================================
  # Nacos 2.3 - 注册中心 & 配置中心
  # ============================================================
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: dw-nacos
    restart: always
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: 18000
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"   # HTTP API
      - "127.0.0.1:9848:9848"   # gRPC
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - drinking-water-net

  # ============================================================
  # Sentinel Dashboard - 限流熔断可视化
  # ============================================================
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.7
    container_name: dw-sentinel
    restart: always
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard -Duser.timezone=Asia/Shanghai"
      TZ: Asia/Shanghai
    volumes:
      # Alpine base image lacks tzdata; mount zoneinfo file for TZ=Asia/Shanghai to work
      - ./docker/zoneinfo/Asia/Shanghai:/usr/share/zoneinfo/Asia/Shanghai:ro
    ports:
      - "127.0.0.1:8858:8858"
    networks:
      - drinking-water-net

  # ============================================================
  # 微服务 - P1 核心设备生命周期链
  # ============================================================

  # auth-service - 认证授权服务
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: dw-auth-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # user-service - 用户服务
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: dw-user-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # device-service - 设备服务
  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: dw-device-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8093:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # iot-service - 物联网服务
  iot-service:
    build:
      context: ./iot-service
      dockerfile: Dockerfile
    container_name: dw-iot-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      emqx:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - drinking-water-net

  # gateway - API 网关
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: dw-gateway
    restart: always
    env_file: .env
    depends_on:
      nacos:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      iot-service:
        condition: service_healthy
      filter-service:
        condition: service_healthy
      worker-order-service:
        condition: service_healthy
      package-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      system-service:
        condition: service_healthy
      push-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # ============================================================
  # 微服务 - P2 滤芯/工单/套餐
  # ============================================================

  # filter-service - 滤芯管理服务
  filter-service:
    build:
      context: ./filter-service
      dockerfile: Dockerfile
    container_name: dw-filter-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # worker-order-service - 工单管理服务
  worker-order-service:
    build:
      context: ./worker-order-service
      dockerfile: Dockerfile
    container_name: dw-worker-order-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # package-service - 套餐管理服务
  package-service:
    build:
      context: ./package-service
      dockerfile: Dockerfile
    container_name: dw-package-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8092/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # ============================================================
  # 微服务 - P3 订单/支付/财务
  # ============================================================

  # order-service - 订单管理服务
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: dw-order-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # payment-service - 支付处理服务
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: dw-payment-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # finance-service - 财务结算服务
  finance-service:
    build:
      context: ./finance-service
      dockerfile: Dockerfile
    container_name: dw-finance-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8094:8094"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8094/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # ============================================================
  # 微服务 - P4 库存/监控/报表/系统/推送
  # ============================================================

  # inventory-service - 库存管理服务
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: dw-inventory-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8095/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # monitor-service - 设备监控告警服务
  monitor-service:
    build:
      context: ./monitor-service
      dockerfile: Dockerfile
    container_name: dw-monitor-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8096:8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # report-service - 报表统计服务
  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: dw-report-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8097:8097"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # system-service - 系统管理服务
  system-service:
    build:
      context: ./system-service
      dockerfile: Dockerfile
    container_name: dw-system-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8098:8098"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8098/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # push-service - 消息推送服务
  push-service:
    build:
      context: ./push-service
      dockerfile: Dockerfile
    container_name: dw-push-service
    restart: always
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - drinking-water-net

  # ============================================================
  # P5: Vue 3 管理后台
  # ============================================================
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: dw-admin-web
    restart: always
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8088:80"
    networks:
      - drinking-water-net

  # HTTPS reverse proxy for WeChat OAuth/web-view domain
  https-proxy:
    image: nginx:1.25-alpine
    container_name: dw-https-proxy
    restart: always
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/https-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/https-proxy/certs:/etc/nginx/certs:ro
      - ./docker/https-proxy/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - drinking-water-net

# ============================================================
# 数据卷
# ============================================================
volumes:
  mysql_data:
  redis_data:
  influxdb_data:
  rabbitmq_data:
  emqx_data:
  minio_data:
  nacos_data:

# ============================================================
# 网络
# ============================================================
networks:
  drinking-water-net:
    driver: bridge
