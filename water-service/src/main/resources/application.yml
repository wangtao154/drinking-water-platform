server:
  port: 8100

spring:
  application:
    name: water-service

  config:
    import:
      - optional:nacos:${spring.application.name}.yml

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:dw-nacos:8848}
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_HOST:dw-nacos:8848}
        username: nacos
        password: nacos
        file-extension: yml

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:dw-mysql:3306}/${MYSQL_DATABASE:drinking_water}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD:DrinkingWater@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  data:
    redis:
      host: ${REDIS_HOST:dw-redis}
      port: 6379
      password: ${REDIS_PASSWORD:Redis@2026}
      database: 0
      timeout: 5000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:drinking-water-platform-jwt-secret-key-please-change-in-production-2026}
  access-expire: 7200
  refresh-expire: 604800

water:
  scan:
    protocol-version: SW1
    command-point: Q74
    sign-secret: ${WATER_SCAN_SIGN_SECRET:water-scan-sign-secret-change-me}
    mock-default-amount: 1
    default-duration-seconds: 120

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform.water: info
    org.springframework.web: info
