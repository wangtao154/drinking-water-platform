server:
  port: 8101

spring:
  application:
    name: ai-service

  config:
    import:
      - optional:nacos:${spring.application.name}.yml

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:dw-nacos:8848}
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_HOST:dw-nacos:8848}
        username: nacos
        password: nacos
        file-extension: yml

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:dw-mysql:3306}/${MYSQL_DATABASE:drinking_water}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD:DrinkingWater@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

jwt:
  secret: ${JWT_SECRET:drinking-water-platform-jwt-secret-key-please-change-in-production-2026}
  access-expire: ${JWT_ACCESS_EXPIRE:7200}
  refresh-expire: ${JWT_REFRESH_EXPIRE:604800}

influxdb:
  url: ${INFLUXDB_URL:http://dw-influxdb:8086}
  token: ${INFLUXDB_TOKEN:drinking-water-super-token-please-change-in-production}
  org: ${INFLUXDB_ORG:platform}
  bucket: ${INFLUXDB_BUCKET:drinking_water}
  timeout-seconds: ${AI_INFLUXDB_TIMEOUT_SECONDS:90}

ai:
  qwen:
    enabled: ${AI_QWEN_ENABLED:true}
    api-key: ${AI_QWEN_API_KEY:}
    base-url: ${AI_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${AI_QWEN_MODEL:qwen3.7-plus}
    timeout-seconds: ${AI_QWEN_TIMEOUT_SECONDS:45}
  ro:
    default-rated-pure-liters: ${AI_RO_DEFAULT_RATED_PURE_LITERS:12000}
    default-range-days: ${AI_RO_DEFAULT_RANGE_DAYS:30}
    default-aggregate-every: ${AI_RO_DEFAULT_AGGREGATE_EVERY:30m}
  assistant:
    enabled: ${AI_ASSISTANT_ENABLED:true}
    max-question-chars: ${AI_ASSISTANT_MAX_QUESTION_CHARS:1000}
    max-knowledge-documents: ${AI_ASSISTANT_MAX_KNOWLEDGE_DOCUMENTS:4}
    max-knowledge-chars: ${AI_ASSISTANT_MAX_KNOWLEDGE_CHARS:18000}
    max-answer-chars: ${AI_ASSISTANT_MAX_ANSWER_CHARS:4000}
    rate-limit-window-seconds: ${AI_ASSISTANT_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests-per-user: ${AI_ASSISTANT_MAX_REQUESTS_PER_USER:8}
    tools:
      enabled: ${AI_ASSISTANT_TOOLS_ENABLED:true}
      timeout-seconds: ${AI_ASSISTANT_TOOL_TIMEOUT_SECONDS:5}
      device-base-url: ${AI_ASSISTANT_DEVICE_BASE_URL:http://device-service:8083}
      monitor-base-url: ${AI_ASSISTANT_MONITOR_BASE_URL:http://monitor-service:8096}
      work-order-base-url: ${AI_ASSISTANT_WORK_ORDER_BASE_URL:http://worker-order-service:8089}
      water-base-url: ${AI_ASSISTANT_WATER_BASE_URL:http://water-service:8100}
      report-base-url: ${AI_ASSISTANT_REPORT_BASE_URL:http://report-service:8097}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN:}

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform.ai: info
    org.springframework.web: info
