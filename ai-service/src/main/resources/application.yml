server:
  port: 8101

spring:
  application:
    name: ai-service

  config:
    import:
      - optional:nacos:${spring.application.name}.yml

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:dw-nacos:8848}
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_HOST:dw-nacos:8848}
        username: nacos
        password: nacos
        file-extension: yml

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:dw-mysql:3306}/${MYSQL_DATABASE:drinking_water}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD:DrinkingWater@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

influxdb:
  url: ${INFLUXDB_URL:http://dw-influxdb:8086}
  token: ${INFLUXDB_TOKEN:drinking-water-super-token-please-change-in-production}
  org: ${INFLUXDB_ORG:platform}
  bucket: ${INFLUXDB_BUCKET:drinking_water}
  timeout-seconds: ${AI_INFLUXDB_TIMEOUT_SECONDS:90}

ai:
  qwen:
    enabled: ${AI_QWEN_ENABLED:true}
    api-key: ${AI_QWEN_API_KEY:}
    base-url: ${AI_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${AI_QWEN_MODEL:qwen3.7-plus}
    timeout-seconds: ${AI_QWEN_TIMEOUT_SECONDS:45}
  ro:
    default-rated-pure-liters: ${AI_RO_DEFAULT_RATED_PURE_LITERS:12000}
    default-range-days: ${AI_RO_DEFAULT_RANGE_DAYS:30}
    default-aggregate-every: ${AI_RO_DEFAULT_AGGREGATE_EVERY:30m}

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform.ai: info
    org.springframework.web: info
